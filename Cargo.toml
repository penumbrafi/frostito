[package]
name = "frostito"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "nested FROST, hardened DKG, and proactive resharing, on ZF frost-core"
repository = "https://github.com/penumbrafi/frostito"
documentation = "https://docs.rs/frostito"
readme = "README.md"
keywords = ["threshold", "frost", "schnorr", "mpc", "reshare"]
categories = ["cryptography", "no-std"]

[features]
default = ["std", "ristretto255"]
std = [
    "sha2/std",
    "rand_core/std",
]
# Confidential, authenticated DKG round-2 delivery (`osst::sealed`).
#
# Needs std (snow does), so the no_std core stays clean and the plaintext
# SubShare/Dealer API is unchanged beneath it.
sealed = ["std", "dep:snow", "dep:x25519-dalek", "dep:hkdf"]



# Curve backends
ristretto255 = ["dep:curve25519-dalek"]
pallas = ["dep:pasta_curves", "dep:blake2b_simd"]
secp256k1 = ["dep:k256"]
decaf377 = ["dep:decaf377"]
# ZF frost-core integration. `zf` alone brings in the audited signing core;
# the per-backend features add ZF's ciphersuite for that curve, except
# decaf377, which RFC 9591 does not register and which `src/zf.rs` supplies.
zf = ["dep:frost-core"]
zf-ristretto255 = ["zf", "ristretto255", "dep:frost-ristretto255"]
zf-secp256k1 = ["zf", "secp256k1", "dep:frost-secp256k1"]
zf-decaf377 = ["zf", "decaf377"]

[dependencies]
# hashing
sha2 = { version = "0.10", default-features = false }

# randomness
rand_core = { version = "0.6", default-features = false }

# secret zeroization
zeroize = { version = "1.8", default-features = false, features = ["derive"] }

# Curve backends (optional)
# ristretto255 - for Polkadot/sr25519 compatibility
curve25519-dalek = { version = "4.1", default-features = false, features = ["digest", "group", "alloc", "rand_core", "zeroize"], optional = true }

# pallas - for Zcash Orchard compatibility.
# Zakura Common 1.0 fork (pasta-1.0 / ff+group 0.14). Package rename keeps the
# `use pasta_curves` paths working; the pallas backend only touches stable
# ff/group traits (Field/PrimeField/FromUniformBytes/Group/GroupEncoding) -
# except `Field::random`, which ff 0.14 moved onto rand_core 0.10 (see curve.rs).
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0", default-features = false, features = ["alloc"], optional = true }

# secp256k1 - for Bitcoin compatibility
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"], optional = true }

# blake2b for Zcash RedPallas challenge hash
blake2b_simd = { version = "1.0", default-features = false, optional = true }

# for zeroize implementations on external scalar types
generic-array = { version = "0.14", default-features = false, optional = true }

# sealed DKG round 2: Noise_K_25519_ChaChaPoly_BLAKE2s, the same pattern ZF's
# frost-client and zcli's frost-spend use.
snow = { version = "0.9", default-features = false, features = ["default-resolver"], optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
hkdf = { version = "0.12", optional = true }

# decaf377 - for Penumbra compatibility
decaf377 = { version = "0.10", default-features = false, optional = true }

# serialization
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }

# substrate compatibility
codec = { version = "3.6", package = "parity-scale-codec", default-features = false, features = ["derive"], optional = true }
scale-info = { version = "2.11", default-features = false, features = ["derive"], optional = true }
frost-core = { version = "3", default-features = false, features = ["internals", "serialization"], optional = true }
frost-ristretto255 = { version = "3", default-features = false, optional = true }
frost-secp256k1 = { version = "3", default-features = false, optional = true }

[dev-dependencies]
rand = "0.8"
hex = "0.4"
# Zakura Common 1.0's ff 0.14 bounds `Field::random` on rand_core 0.10's `Rng`,
# which rand 0.8's `OsRng` does not implement. The pallas tests bridge the two
# with a local adapter; see `src/test_rng.rs`.
rand_core_10 = { package = "rand_core", version = "0.10", default-features = false }

# end-to-end: ZF FROST(Pallas) DKG -> osst reshare -> ZF FROST signing
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "475a552", features = ["frost"] }

# The narsil examples are ristretto255 walkthroughs.
[[example]]
name = "narsil_escrow"
required-features = ["ristretto255"]

[[example]]
name = "narsil_nested"
required-features = ["ristretto255"]

# The ZF FROST cross-test needs the Orchard spend-auth (pallas) backend.
[[test]]
name = "reshare_zf_frost"
required-features = ["pallas", "std"]
